{% extends 'base.html' %}

{% block head %}

{% endblock %}

{% block body %}
<div class="content">
    <h1>Bounty Master</h1>

    <table>

        <tr>
            <th>Task</th>
            <th>Added</th>
            <th>Deadline</th>
            <th>Explanation</th>
            <th>Action</th>
        </tr>
        {% for task in tasks %}
            <tr>
                <td>
                    {{ task.content }}
                </td>
                <td>
                    {{ task.date_created.date() }}
                </td>
                <td>
                    {{ task.deadline }}
                </td>
                <td>
                    {{ task.explanation }}
                </td>
                <td>
                    <a href="/delete/{{task.id}}">delete</a>
                    <br>
                    <a href="/update/{{task.id}}">update</a>
                </td>
            </tr>
        {% endfor %}       
    </table>
    <br>
    <form action="/", method="POST">
        <input type="text" name="content" id="content">
        <input type="date" name="deadline" id="deadline">
        <input type="text" name="explanation" id="explanation">
        <input type="submit" value="add task">
    </form> 

</div>
{% endblock %}
